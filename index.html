<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HADIA IS A LABUBU</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #050014;
        font-family: Arial, Helvetica, sans-serif;
        cursor: crosshair;
    }

    canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
    }

    #overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
            radial-gradient(circle at center,
                rgba(255, 0, 170, 0.15),
                transparent 45%),
            radial-gradient(circle at 20% 20%,
                rgba(0, 255, 255, 0.10),
                transparent 35%),
            radial-gradient(circle at 80% 80%,
                rgba(120, 0, 255, 0.12),
                transparent 35%);
    }

    .text {
        position: absolute;
        white-space: nowrap;
        font-weight: 900;
        font-size: clamp(18px, 2vw, 38px);
        letter-spacing: 1px;
        user-select: none;

        color: white;

        text-shadow:
            0 0 5px #fff,
            0 0 10px #ff00cc,
            0 0 20px #ff00cc,
            0 0 40px #7b00ff;

        animation:
            floatAround var(--duration) linear infinite,
            pulse 1.5s ease-in-out infinite alternate;

        transform: rotate(var(--rotation));
    }

    @keyframes floatAround {
        0% {
            transform:
                translate(0, 0)
                rotate(var(--rotation))
                scale(0.8);
        }

        25% {
            transform:
                translate(var(--x1), var(--y1))
                rotate(calc(var(--rotation) + 90deg))
                scale(1.15);
        }

        50% {
            transform:
                translate(var(--x2), var(--y2))
                rotate(calc(var(--rotation) + 180deg))
                scale(0.9);
        }

        75% {
            transform:
                translate(var(--x3), var(--y3))
                rotate(calc(var(--rotation) + 270deg))
                scale(1.2);
        }

        100% {
            transform:
                translate(0, 0)
                rotate(calc(var(--rotation) + 360deg))
                scale(0.8);
        }
    }

    @keyframes pulse {
        from {
            filter: brightness(0.8);
        }

        to {
            filter: brightness(1.6);
        }
    }

    #main {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;

        font-size: clamp(35px, 7vw, 110px);
        font-weight: 1000;
        text-align: center;
        line-height: 0.95;

        color: white;

        text-shadow:
            0 0 10px #fff,
            0 0 20px #ff00cc,
            0 0 40px #ff00cc,
            0 0 80px #7b00ff,
            0 0 120px #00ffff;

        animation: mainPulse 1.2s infinite alternate;

        pointer-events: none;
        user-select: none;
    }

    @keyframes mainPulse {
        from {
            transform: translate(-50%, -50%) scale(0.95);
        }

        to {
            transform: translate(-50%, -50%) scale(1.05);
        }
    }

    #warning {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 20;

        color: #fff;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 4px;

        opacity: 0.7;
        pointer-events: none;
    }

    .flash {
        position: fixed;
        inset: 0;
        background: white;
        z-index: 50;
        pointer-events: none;

        animation: flashAnim 0.35s forwards;
    }

    @keyframes flashAnim {
        from { opacity: 0.7; }
        to { opacity: 0; }
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="overlay"></div>

<div id="warning">
    ⚠ LABUBU DETECTED ⚠
</div>

<div id="main">
    HADIA<br>
    IS A<br>
    LABUBU
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});


// ===============================
// FLOATING TEXT
// ===============================

const words = [];

const colors = [
    "#ff00cc",
    "#7b00ff",
    "#00ffff",
    "#ff1493",
    "#ffffff",
    "#8a2be2"
];

function createText() {

    const el = document.createElement("div");

    el.className = "text";
    el.innerText = "HADIA IS A LABUBU";

    el.style.left = Math.random() * 100 + "vw";
    el.style.top = Math.random() * 100 + "vh";

    el.style.setProperty(
        "--duration",
        (8 + Math.random() * 15) + "s"
    );

    el.style.setProperty(
        "--rotation",
        (Math.random() * 40 - 20) + "deg"
    );

    el.style.setProperty(
        "--x1",
        (Math.random() * 500 - 250) + "px"
    );

    el.style.setProperty(
        "--y1",
        (Math.random() * 500 - 250) + "px"
    );

    el.style.setProperty(
        "--x2",
        (Math.random() * 700 - 350) + "px"
    );

    el.style.setProperty(
        "--y2",
        (Math.random() * 700 - 350) + "px"
    );

    el.style.setProperty(
        "--x3",
        (Math.random() * 500 - 250) + "px"
    );

    el.style.setProperty(
        "--y3",
        (Math.random() * 500 - 250) + "px"
    );

    el.style.color =
        colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(el);

    words.push(el);
}


// Create MANY of them
for (let i = 0; i < 80; i++) {
    createText();
}


// ===============================
// PARTICLE BACKGROUND
// ===============================

const particles = [];

for (let i = 0; i < 180; i++) {

    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,

        size: Math.random() * 3 + 1,

        speedX: Math.random() * 1.5 - 0.75,
        speedY: Math.random() * 1.5 - 0.75,

        hue: Math.random() * 360
    });
}

function animateParticles() {

    ctx.clearRect(0, 0, width, height);

    for (const p of particles) {

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > width)
            p.speedX *= -1;

        if (p.y < 0 || p.y > height)
            p.speedY *= -1;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${p.hue},100%,70%,0.7)`;

        ctx.shadowBlur = 15;
        ctx.shadowColor =
            `hsl(${p.hue},100%,60%)`;

        ctx.fill();
    }

    requestAnimationFrame(animateParticles);
}

animateParticles();


// ===============================
// MOUSE PARTICLE TRAIL
// ===============================

const mouseParticles = [];

document.addEventListener("mousemove", (e) => {

    for (let i = 0; i < 4; i++) {

        mouseParticles.push({
            x: e.clientX,
            y: e.clientY,

            size: Math.random() * 5 + 2,

            vx: Math.random() * 6 - 3,
            vy: Math.random() * 6 - 3,

            life: 1,

            hue: Math.random() * 360
        });
    }
});

function animateMouseParticles() {

    for (let i = mouseParticles.length - 1; i >= 0; i--) {

        const p = mouseParticles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life -= 0.025;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * p.life,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${p.hue},100%,70%,${p.life})`;

        ctx.fill();

        if (p.life <= 0) {
            mouseParticles.splice(i, 1);
        }
    }

    requestAnimationFrame(animateMouseParticles);
}

animateMouseParticles();


// ===============================
// RANDOM SCREEN FLASH
// ===============================

function randomFlash() {

    const flash = document.createElement("div");

    flash.className = "flash";

    document.body.appendChild(flash);

    setTimeout(() => {
        flash.remove();
    }, 350);

    setTimeout(
        randomFlash,
        5000 + Math.random() * 10000
    );
}

randomFlash();


// ===============================
// CLICK EXPLOSION
// ===============================

document.addEventListener("click", (e) => {

    for (let i = 0; i < 35; i++) {

        const p = {
            x: e.clientX,
            y: e.clientY,

            size: Math.random() * 6 + 2,

            vx: Math.cos(Math.random() * Math.PI * 2)
                * (Math.random() * 10 + 2),

            vy: Math.sin(Math.random() * Math.PI * 2)
                * (Math.random() * 10 + 2),

            life: 1,

            hue: Math.random() * 360
        };

        mouseParticles.push(p);
    }

    // Add another sentence every click
    const el = document.createElement("div");

    el.className = "text";
    el.innerText = "HADIA IS A LABUBU";

    el.style.left = e.clientX + "px";
    el.style.top = e.clientY + "px";

    el.style.color =
        colors[Math.floor(Math.random() * colors.length)];

    el.style.setProperty(
        "--duration",
        "4s"
    );

    el.style.setProperty(
        "--rotation",
        (Math.random() * 80 - 40) + "deg"
    );

    el.style.setProperty("--x1", "-300px");
    el.style.setProperty("--y1", "-200px");
    el.style.setProperty("--x2", "400px");
    el.style.setProperty("--y2", "300px");
    el.style.setProperty("--x3", "-200px");
    el.style.setProperty("--y3", "400px");

    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 4000);
});

</script>

</body>
</html>
